<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>FinTrack Lite</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header>
      <h1>FinTrack Lite</h1>
      <p>Controle suas finanças de forma simples.</p>
    </header>

    <main>
      <section>
        <h2>Resumo financeiro</h2>

        <div>
          <h3>Saldo</h3>
          <p id="saldo">R$ 0,00</p>
        </div>

        <div>
          <h3>Receitas</h3>
          <p id="receitas">R$ 0,00</p>
        </div>

        <div>
          <h3>Despesas</h3>
          <p id="despesas">R$ 0,00</p>
        </div>
      </section>

      <section>
        <h2>Nova transação</h2>

        <form id="form-transacao">
          <div>
            <label for="descricao">Descrição</label>
            <input
              type="text"
              id="descricao"
              name="descricao"
              placeholder="Ex: Salário"
              required
            />
          </div>

          <div>
            <label for="valor">Valor</label>
            <input
              type="number"
              id="valor"
              name="valor"
              placeholder="0,00"
              step="0.01"
              min="0.01"
              required
            />
          </div>

          <div>
            <label for="categoria">Categoria</label>

            <select id="categoria" name="categoria" required>
              <option value="">Selecione uma categoria</option>
              <option value="alimentacao">Alimentação</option>
              <option value="transporte">Transporte</option>
              <option value="lazer">Lazer</option>
              <option value="salario">Salário</option>
              <option value="outros">Outros</option>
            </select>
          </div>

          <div>
            <label for="tipo">Tipo</label>

            <select id="tipo" name="tipo" required>
              <option value="">Selecione o tipo</option>
              <option value="receita">Receita</option>
              <option value="despesa">Despesa</option>
            </select>
          </div>

          <button type="submit">Adicionar transação</button>
        </form>

        <p id="mensagem-status" role="status" aria-live="polite"></p>
      </section>

      <section>
        <h2>Minhas transações</h2>

        <div>
          <label for="filtro-tipo">Filtrar por tipo</label>

          <select id="filtro-tipo">
            <option value="todos">Todos</option>
            <option value="receita">Receita</option>
            <option value="despesa">Despesas</option>
          </select>
        </div>

        <ul id="lista-transacoes">
          <li id="mensagem-vazia">Nenhuma transação cadastrada.</li>
        </ul>
      </section>
    </main>

    <footer>
      <p>FinTrack Lite</p>
    </footer>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
